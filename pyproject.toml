[project]
name = "cubebench-harness"
version = "0.1.0"
description = "LLM cube-solving harness backed by cubejs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.72.0",
  "google-genai>=1.42.0",
  "openai>=2.0.0",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.2",
]

[project.scripts]
cubebench-harness = "cubebench_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/cubebench_harness"]
