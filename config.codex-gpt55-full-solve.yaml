# One isolated GPT-5.5 full-solve attempt on the fixed comparison scramble.
# Codex exposes the model as gpt-5.5 and supports xhigh (not max); the
# launcher records the requested max effort separately from effective xhigh.
cube: 3x3
representation: cubie_json
tasks:
  - full_solve
model_names:
  - gpt-5.5-xhigh
n_runs_per_task: 1
scramble_name: one_layer_01
scramble: "B U F B D F R L' F D2 F2 L' D2 F2 B2 R U2 L2 D2 L2 F"
max_turns: 50
max_output_tokens: 100000
openai:
  reasoning_summary: detailed
  compact_threshold: 175000
