# Four independent Codex attempts on the same existing one_layer_01 scramble.
# CubeBench calls the full-cube task `full_solve`; `full_cube` is the user-facing
# label used in the comparison request.
cube: 3x3
representation: cubie_json
tasks:
  - f2l
  - full_solve
model_names:
  - gpt-5.6-sol-max
  - gpt-6-astra-max
n_runs_per_task: 1
scramble_name: one_layer_01
scramble: "B U F B D F R L' F D2 F2 L' D2 F2 B2 R U2 L2 D2 L2 F"
max_turns: 50
max_output_tokens: 100000
openai:
  reasoning_summary: detailed
  compact_threshold: 175000
